name: Programme bauen

# Baut die Android-APK und das Windows-Programm (ZIP).
# Start: von Hand unter "Actions" oder durch einen Tag wie v1.0.0.
# Bei einem Tag entsteht zusätzlich ein GitHub-Release mit beiden Dateien.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  # Probelauf, wenn diese Datei in einem PR geändert wird.
  pull_request:
    paths: ['.github/workflows/release.yml', 'android/app/build.gradle.kts']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Signierschlüssel einrichten (falls hinterlegt)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Kein Schlüssel hinterlegt, APK wird mit Debug-Schlüssel signiert."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload.jks
          cat > android/key.properties <<PROPS
          storeFile=upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
      - run: flutter build apk --release
      - run: mv build/app/outputs/flutter-apk/app-release.apk WealthFlow.apk
      - uses: actions/upload-artifact@v4
        with:
          name: WealthFlow-android
          path: WealthFlow.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: ZIP erstellen
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath WealthFlow-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: WealthFlow-windows
          path: WealthFlow-Windows.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            WealthFlow.apk
            WealthFlow-Windows.zip
