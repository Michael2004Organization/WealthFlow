name: Flutter

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # flutter analyze prüft auch server/, das eigene Pakete hat.
      - run: dart pub get --directory server
      - run: flutter analyze
      - run: flutter test
